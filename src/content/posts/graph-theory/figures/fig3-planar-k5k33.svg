<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="400" fill="#f8fafc" rx="8"/>
  <text x="360" y="26" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="15" font-weight="bold" fill="#0f172a">两个库拉托斯基图（Kuratowski graphs）</text>

  <!-- Divider -->
  <line x1="360" y1="36" x2="360" y2="390" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ══ LEFT: K5 ══ -->
  <text x="180" y="52" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#dc2626">K₅</text>
  <text x="180" y="68" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">5 顶点完全图，任意两顶点相连</text>

  <!-- K5 vertices: pentagon layout -->
  <!-- v1 top: (180,100), v2 top-right: (275,165), v3 bot-right: (240,270), v4 bot-left: (120,270), v5 top-left: (85,165) -->
  <!-- All 10 edges -->
  <line x1="180" y1="100" x2="275" y2="165" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="180" y1="100" x2="240" y2="270" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="180" y1="100" x2="120" y2="270" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="180" y1="100" x2="85"  y2="165" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="275" y1="165" x2="240" y2="270" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="275" y1="165" x2="120" y2="270" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="275" y1="165" x2="85"  y2="165" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="240" y1="270" x2="120" y2="270" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="240" y1="270" x2="85"  y2="165" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="120" y1="270" x2="85"  y2="165" stroke="#dc2626" stroke-width="1.8"/>

  <!-- K5 vertices -->
  <circle cx="180" cy="100"  r="12" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="275" cy="165"  r="12" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="240" cy="270"  r="12" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="120" cy="270"  r="12" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="85"  cy="165"  r="12" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <text x="180" y="100"  text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₁</text>
  <text x="275" y="165"  text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₂</text>
  <text x="240" y="270"  text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₃</text>
  <text x="120" y="270"  text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₄</text>
  <text x="85"  y="165"  text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₅</text>

  <!-- K5 stats -->
  <rect x="25" y="300" width="305" height="80" fill="#fee2e2" stroke="#fca5a5" rx="5"/>
  <text x="178" y="318" text-anchor="middle" font-family="serif" font-size="13" fill="#dc2626">n=5,  m=10,  3n−6 = 9</text>
  <text x="178" y="337" text-anchor="middle" font-family="serif" font-size="13" fill="#dc2626">m = 10 > 9 = 3n−6</text>
  <text x="178" y="356" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#b91c1c">→ 违反推论3，K₅ 非可平面图</text>
  <text x="178" y="373" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">每个顶点度=4，需每面次数≥3才能有足够面</text>

  <!-- ══ RIGHT: K3,3 ══ -->
  <text x="540" y="52" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#7c3aed">K₃,₃</text>
  <text x="540" y="68" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">完全二部图，X={u₁,u₂,u₃}, Y={v₁,v₂,v₃}</text>

  <!-- K3,3: top row X at y=110: u1=420,u2=540,u3=660; bottom row Y at y=250: v1=420,v2=540,v3=660 -->
  <!-- All 9 edges -->
  <line x1="420" y1="122" x2="420" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="420" y1="122" x2="540" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="420" y1="122" x2="660" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="540" y1="122" x2="420" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="540" y1="122" x2="540" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="540" y1="122" x2="660" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="660" y1="122" x2="420" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="660" y1="122" x2="540" y2="238" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="660" y1="122" x2="660" y2="238" stroke="#7c3aed" stroke-width="1.8"/>

  <!-- X vertices (top) -->
  <circle cx="420" cy="110" r="12" fill="#7c3aed" stroke="white" stroke-width="1.5"/>
  <circle cx="540" cy="110" r="12" fill="#7c3aed" stroke="white" stroke-width="1.5"/>
  <circle cx="660" cy="110" r="12" fill="#7c3aed" stroke="white" stroke-width="1.5"/>
  <text x="420" y="110" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">u₁</text>
  <text x="540" y="110" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">u₂</text>
  <text x="660" y="110" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">u₃</text>

  <!-- Y vertices (bottom) -->
  <circle cx="420" cy="250" r="12" fill="#ea580c" stroke="white" stroke-width="1.5"/>
  <circle cx="540" cy="250" r="12" fill="#ea580c" stroke="white" stroke-width="1.5"/>
  <circle cx="660" cy="250" r="12" fill="#ea580c" stroke="white" stroke-width="1.5"/>
  <text x="420" y="250" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₁</text>
  <text x="540" y="250" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₂</text>
  <text x="660" y="250" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">v₃</text>

  <!-- K3,3 stats -->
  <rect x="375" y="280" width="325" height="100" fill="#fee2e2" stroke="#fca5a5" rx="5"/>
  <text x="538" y="298" text-anchor="middle" font-family="serif" font-size="13" fill="#7c3aed">n=6,  m=9</text>
  <text x="538" y="316" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#475569">K₃,₃ 是偶图 → 无奇圈 → 每个面次数 ≥ 4</text>
  <text x="538" y="334" text-anchor="middle" font-family="serif" font-size="12" fill="#7c3aed">推论2 (l=4): m ≤ 4/(4−2)·(6−2) = 8</text>
  <text x="538" y="352" text-anchor="middle" font-family="serif" font-size="13" fill="#dc2626">m = 9 > 8</text>
  <text x="538" y="370" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#b91c1c">→ 违反推论2（需用 l=4），K₃,₃ 非可平面图</text>
</svg>

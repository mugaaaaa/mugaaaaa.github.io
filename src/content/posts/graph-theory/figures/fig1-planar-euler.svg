<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="400" fill="#f8fafc" rx="8"/>
  <text x="340" y="26" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="15" font-weight="bold" fill="#0f172a">欧拉公式：n − m + φ = 2（以 K₄ 为例）</text>

  <!-- ══ LEFT: K4 planar drawing ══ -->
  <!-- v1=(200,80) v2=(70,290) v3=(330,290) v4=(200,220) -->
  <!-- Edges -->
  <line x1="200" y1="92" x2="70"  y2="278" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="92" x2="330" y2="278" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="92" x2="200" y2="208" stroke="#475569" stroke-width="2"/>
  <line x1="70"  y1="290" x2="330" y2="290" stroke="#475569" stroke-width="2"/>
  <line x1="70"  y1="278" x2="200" y2="208" stroke="#475569" stroke-width="2"/>
  <line x1="330" y1="278" x2="200" y2="208" stroke="#475569" stroke-width="2"/>

  <!-- Face labels -->
  <text x="140" y="185" text-anchor="middle" font-family="serif" font-size="14" fill="#2563eb">f₁</text>
  <text x="262" y="185" text-anchor="middle" font-family="serif" font-size="14" fill="#2563eb">f₂</text>
  <text x="200" y="272" text-anchor="middle" font-family="serif" font-size="14" fill="#2563eb">f₃</text>
  <text x="200" y="330" text-anchor="middle" font-family="serif" font-size="14" fill="#ea580c">f₄ (外部面)</text>

  <!-- Vertices -->
  <circle cx="200" cy="80"  r="13" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="70"  cy="290" r="13" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="330" cy="290" r="13" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="200" cy="220" r="13" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="200" y="80"  text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₁</text>
  <text x="70"  y="290" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₂</text>
  <text x="330" y="290" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₃</text>
  <text x="200" y="220" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₄</text>

  <!-- Stats -->
  <rect x="40" y="355" width="310" height="36" fill="#dbeafe" stroke="#93c5fd" rx="5"/>
  <text x="195" y="370" text-anchor="middle" font-family="serif" font-size="13" fill="#1d4ed8">n = 4，  m = 6，  φ = 4</text>
  <text x="195" y="384" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#1d4ed8">n − m + φ = 4 − 6 + 4 = 2  ✓</text>

  <!-- Divider -->
  <line x1="385" y1="40" x2="385" y2="390" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ══ RIGHT: Face degree annotation ══ -->
  <text x="535" y="55" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="13" font-weight="bold" fill="#0f172a">面次数公式</text>
  <text x="535" y="72" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">每条边恰好是两个面的公共边（割边算两次同一面）</text>

  <!-- Face degree table -->
  <rect x="405" y="86" width="255" height="130" fill="white" stroke="#cbd5e1" rx="4"/>
  <text x="412" y="104" font-family="STSong,SimSun,serif" font-size="12" fill="#475569">面</text>
  <text x="476" y="104" font-family="STSong,SimSun,serif" font-size="12" fill="#475569">边界</text>
  <text x="572" y="104" font-family="STSong,SimSun,serif" font-size="12" fill="#475569">deg(f)</text>
  <line x1="405" y1="108" x2="660" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <text x="412" y="124" font-family="serif" font-size="12" fill="#2563eb">f₁</text>
  <text x="450" y="124" font-family="serif" font-size="12" fill="#475569">v₁v₂v₄</text>
  <text x="598" y="124" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">3</text>
  <text x="412" y="142" font-family="serif" font-size="12" fill="#2563eb">f₂</text>
  <text x="450" y="142" font-family="serif" font-size="12" fill="#475569">v₁v₃v₄</text>
  <text x="598" y="142" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">3</text>
  <text x="412" y="160" font-family="serif" font-size="12" fill="#2563eb">f₃</text>
  <text x="450" y="160" font-family="serif" font-size="12" fill="#475569">v₂v₃v₄</text>
  <text x="598" y="160" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">3</text>
  <text x="412" y="178" font-family="serif" font-size="12" fill="#ea580c">f₄</text>
  <text x="450" y="178" font-family="serif" font-size="12" fill="#475569">v₁v₂v₃（外）</text>
  <text x="598" y="178" text-anchor="middle" font-family="serif" font-size="12" fill="#475569">3</text>
  <line x1="405" y1="184" x2="660" y2="184" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="200" font-family="STSong,SimSun,serif" font-size="12" fill="#166534">Σ deg(f) = 12 = 2 × 6 = 2m  ✓</text>

  <!-- Proof sketch of Euler -->
  <rect x="405" y="228" width="255" height="100" fill="#fff7ed" stroke="#fed7aa" rx="5"/>
  <text x="535" y="245" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" font-weight="bold" fill="#92400e">欧拉公式的证明思路</text>
  <text x="412" y="262" font-family="STSong,SimSun,serif" font-size="11" fill="#0f172a">情形1：G 是树 → m=n−1, φ=1</text>
  <text x="427" y="277" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">n−(n−1)+1 = 2  ✓</text>
  <text x="412" y="292" font-family="STSong,SimSun,serif" font-size="11" fill="#0f172a">情形2：G 不是树 → 存在非割边 e</text>
  <text x="427" y="307" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">G−e: 连通，m−1条边，φ−1个面</text>
  <text x="427" y="322" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">由最小性假设 G−e 满足 → G 也满足</text>

  <rect x="405" y="340" width="255" height="44" fill="#dcfce7" stroke="#86efac" rx="5"/>
  <text x="535" y="357" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#166534">n − m + φ = 2</text>
  <text x="535" y="375" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#15803d">（连通平面图；k 个连通分支则 = k+1）</text>
</svg>

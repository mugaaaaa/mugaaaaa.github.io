<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="430" fill="#f8fafc" rx="8"/>
  <text x="360" y="27" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="16" font-weight="bold" fill="#0f172a">Hall 条件违反示例：|N(S)| ＜ |S|</text>
  <text x="360" y="44" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">取子集 S = {A, C, D, F}，找到 N(S) 只有 3 个点 ＜ 4 = |S|，证明不存在完美匹配</text>

  <!-- ── Bipartite graph from slides p.12 ── -->
  <!-- X (students): A,B,C,D,E,F,G  y=145 -->
  <!-- Y (jobs): a,b,c,d,e,f,g       y=295 -->
  <!-- x positions: A=65, B=155, C=245, D=320, E=400, F=480, G=570 -->
  <!-- y positions: a=65, b=155, c=245, d=320, e=400, f=480, g=570 -->

  <!-- all job nodes y=295 at same x offsets -->

  <!-- Edges from the slide:
    A: b, c
    B: a, b, d, f, g
    C: b, e
    D: b, c, e
    E: a, c, d, f
    F: c, e
    G: d, e, f, g
  -->

  <!-- X-layer row y=145 -->
  <!-- Y-layer row y=295 -->
  <!-- X x-coords: A=60, B=145, C=230, D=315, E=395, F=475, G=560 -->
  <!-- Y x-coords: a=60, b=155, c=250, d=340, e=430, f=510, g=595 -->

  <!-- All edges (gray) -->
  <!-- A(60,145): b(155,295), c(250,295) -->
  <line x1="60"  y1="158" x2="155" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60"  y1="158" x2="250" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- B(145,145): a,b,d,f,g -->
  <line x1="145" y1="158" x2="60"  y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="145" y1="158" x2="155" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="145" y1="158" x2="340" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="145" y1="158" x2="510" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="145" y1="158" x2="595" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- C(230,145): b,e -->
  <line x1="230" y1="158" x2="155" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="230" y1="158" x2="430" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <!-- D(315,145): b,c,e -->
  <line x1="315" y1="158" x2="155" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="315" y1="158" x2="250" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="315" y1="158" x2="430" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <!-- E(395,145): a,c,d,f -->
  <line x1="395" y1="158" x2="60"  y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="395" y1="158" x2="250" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="395" y1="158" x2="340" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="395" y1="158" x2="510" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- F(475,145): c,e -->
  <line x1="475" y1="158" x2="250" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="475" y1="158" x2="430" y2="282" stroke="#2563eb" stroke-width="2.5"/>
  <!-- G(560,145): d,e,f,g -->
  <line x1="560" y1="158" x2="340" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="560" y1="158" x2="430" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="560" y1="158" x2="510" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="560" y1="158" x2="595" y2="282" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- S = {A, C, D, F}: red border; in X-layer -->
  <!-- A=60, C=230, D=315, F=475 -->
  <!-- N(S) = {b(155), c(250), e(430)} : 3 nodes in Y -->

  <!-- S pill highlight -->
  <rect x="42"  y="130" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>
  <rect x="212" y="130" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>
  <rect x="297" y="130" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>
  <rect x="457" y="130" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>

  <!-- N(S) highlight in Y -->
  <rect x="137" y="280" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>
  <rect x="232" y="280" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>
  <rect x="412" y="280" width="35" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="15"/>

  <!-- X vertices -->
  <circle cx="60"  cy="145" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="145" cy="145" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="230" cy="145" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="315" cy="145" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="395" cy="145" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="475" cy="145" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="560" cy="145" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>

  <text x="60"  y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">A</text>
  <text x="145" y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">B</text>
  <text x="230" y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">C</text>
  <text x="315" y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">D</text>
  <text x="395" y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">E</text>
  <text x="475" y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">F</text>
  <text x="560" y="145" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">G</text>

  <!-- Y vertices -->
  <circle cx="60"  cy="295" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="155" cy="295" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="250" cy="295" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="340" cy="295" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="430" cy="295" r="13" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="510" cy="295" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="595" cy="295" r="13" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>

  <text x="60"  y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">a</text>
  <text x="155" y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">b</text>
  <text x="250" y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">c</text>
  <text x="340" y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">d</text>
  <text x="430" y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">e</text>
  <text x="510" y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">f</text>
  <text x="595" y="295" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">g</text>

  <!-- S and N(S) brace labels -->
  <text x="260" y="118" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#dc2626">S = {A, C, D, F}，|S| = 4</text>
  <text x="267" y="322" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#dc2626">N(S) = {b, c, e}，|N(S)| = 3</text>

  <!-- Vertical line markers for S and N(S) -->
  <line x1="50" y1="126" x2="492" y2="126" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="140" y1="318" x2="448" y2="318" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ── Conclusion ── -->
  <line x1="28" y1="348" x2="692" y2="348" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="40" y="358" width="635" height="62" fill="#fee2e2" stroke="#fca5a5" rx="5"/>
  <text x="358" y="374" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="13" font-weight="bold" fill="#dc2626">|N(S)| = 3 ＜ 4 = |S|  →  Hall 条件不满足！</text>
  <text x="358" y="392" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#b91c1c">A, C, D, F 四人只有 b, c, e 三个职位可选，至少有一人无法匹配</text>
  <text x="358" y="410" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#991b1b">→ 不存在饱和 X 中每个顶点的匹配（不存在"学生全部就业"的完美安排）</text>
</svg>

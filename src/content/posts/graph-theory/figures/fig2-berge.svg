<svg width="720" height="490" viewBox="0 0 720 490" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="490" fill="#f8fafc" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="16" font-weight="bold" fill="#0f172a">贝尔热定理充分性证明：对称差分解</text>
  <text x="360" y="46" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#475569">若 M 不是最大匹配，则 ∃ 更大匹配 M₁（|M₁|＞|M|）→ H = M₁ΔM 中必含 M-可扩路</text>

  <!-- ── LEFT panel: M ── -->
  <rect x="28" y="60" width="320" height="130" fill="white" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="188" y="80" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="13" font-weight="bold" fill="#2563eb">匹配 M（蓝色）  |M| = 2</text>
  <text x="188" y="96" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">M = { v₂v₃, v₄v₅ }</text>

  <!-- v1..v6 at y=155, x: 50,110,170,230,290,350 -->
  <line x1="50"  y1="155" x2="110" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="155" x2="170" y2="155" stroke="#2563eb" stroke-width="7"/>
  <line x1="170" y1="155" x2="230" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="230" y1="155" x2="290" y2="155" stroke="#2563eb" stroke-width="7"/>
  <line x1="290" y1="155" x2="350" y2="155" stroke="#94a3b8" stroke-width="2"/>

  <circle cx="50"  cy="155" r="11" fill="white"   stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="110" cy="155" r="11" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="170" cy="155" r="11" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="230" cy="155" r="11" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="290" cy="155" r="11" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="350" cy="155" r="11" fill="white"   stroke="#dc2626" stroke-width="2.5"/>

  <text x="50"  y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="#dc2626">v₁</text>
  <text x="110" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₂</text>
  <text x="170" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₃</text>
  <text x="230" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₄</text>
  <text x="290" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₅</text>
  <text x="350" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="#dc2626">v₆</text>
  <text x="50"  y="138" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#dc2626">未饱和</text>
  <text x="350" y="138" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#dc2626">未饱和</text>

  <!-- ── RIGHT panel: M1 ── -->
  <rect x="372" y="60" width="320" height="130" fill="white" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="532" y="80" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="13" font-weight="bold" fill="#ea580c">最大匹配 M₁（橙色）  |M₁| = 3</text>
  <text x="532" y="96" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">M₁ = { v₁v₂, v₃v₄, v₅v₆ }</text>

  <!-- v1..v6 at y=155, x: 394,454,514,574,634,694 -->
  <line x1="394" y1="155" x2="454" y2="155" stroke="#ea580c" stroke-width="7"/>
  <line x1="454" y1="155" x2="514" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="514" y1="155" x2="574" y2="155" stroke="#ea580c" stroke-width="7"/>
  <line x1="574" y1="155" x2="634" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="634" y1="155" x2="694" y2="155" stroke="#ea580c" stroke-width="7"/>

  <circle cx="394" cy="155" r="11" fill="#ea580c"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="454" cy="155" r="11" fill="#1e293b"   stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="514" cy="155" r="11" fill="#1e293b"   stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="574" cy="155" r="11" fill="#1e293b"   stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="634" cy="155" r="11" fill="#1e293b"   stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="694" cy="155" r="11" fill="#ea580c"  stroke="#0f172a" stroke-width="1.5"/>

  <text x="394" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₁</text>
  <text x="454" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₂</text>
  <text x="514" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₃</text>
  <text x="574" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₄</text>
  <text x="634" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₅</text>
  <text x="694" y="155" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₆</text>

  <!-- ── Middle: what H looks like ── -->
  <text x="360" y="218" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="13" font-weight="bold" fill="#0f172a">H = M₁ΔM 的连通分支只有两类：</text>

  <rect x="40"  y="228" width="275" height="46" fill="#eff6ff" stroke="#93c5fd" rx="5"/>
  <text x="178" y="246" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#1d4ed8">① 偶圈（M₁ 与 M 边数相等）</text>
  <text x="178" y="264" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#3b82f6">M₁ 比 M 多 0 条边，不影响计数</text>

  <rect x="390" y="228" width="290" height="46" fill="#fff7ed" stroke="#fed7aa" rx="5"/>
  <text x="535" y="246" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#c2410c">② 路（M₁ 与 M 的边交替出现）</text>
  <text x="535" y="264" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#ea580c">若 M₁ 边多 1 条 → 两端是 M-非饱和点！</text>

  <!-- ── Bottom: H in this example = one path ── -->
  <text x="360" y="300" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="13" fill="#334155">本例：H 只有一个分支，是一条路（因 |M₁|＞|M|，至少存在这样的路）：</text>

  <!-- path v1-v2-v3-v4-v5-v6, alternating orange/blue edges, y=385 -->
  <!-- x: 95,185,275,365,455,545 -->
  <line x1="95"  y1="385" x2="185" y2="385" stroke="#ea580c" stroke-width="7"/>
  <line x1="185" y1="385" x2="275" y2="385" stroke="#2563eb" stroke-width="7"/>
  <line x1="275" y1="385" x2="365" y2="385" stroke="#ea580c" stroke-width="7"/>
  <line x1="365" y1="385" x2="455" y2="385" stroke="#2563eb" stroke-width="7"/>
  <line x1="455" y1="385" x2="545" y2="385" stroke="#ea580c" stroke-width="7"/>

  <text x="140" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#ea580c">M₁</text>
  <text x="230" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#2563eb">M</text>
  <text x="320" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#ea580c">M₁</text>
  <text x="410" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#2563eb">M</text>
  <text x="500" y="370" text-anchor="middle" font-family="serif" font-size="11" fill="#ea580c">M₁</text>

  <circle cx="95"  cy="385" r="13" fill="white"   stroke="#dc2626" stroke-width="3"/>
  <circle cx="185" cy="385" r="13" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="275" cy="385" r="13" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="365" cy="385" r="13" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="455" cy="385" r="13" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="545" cy="385" r="13" fill="white"   stroke="#dc2626" stroke-width="3"/>

  <text x="95"  y="385" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="#dc2626">v₁</text>
  <text x="185" y="385" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₂</text>
  <text x="275" y="385" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₃</text>
  <text x="365" y="385" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₄</text>
  <text x="455" y="385" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="white">v₅</text>
  <text x="545" y="385" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="12" fill="#dc2626">v₆</text>

  <text x="95"  y="408" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#dc2626">M-非饱和</text>
  <text x="545" y="408" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#dc2626">M-非饱和</text>

  <rect x="100" y="422" width="520" height="38" fill="#fef9c3" stroke="#fbbf24" rx="5"/>
  <text x="360" y="437" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#78350f">|M₁|＞|M| → 路中 M₁ 边（3条）多于 M 边（2条）</text>
  <text x="360" y="452" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#b45309">→ 路两端 v₁, v₆ 均为 M-非饱和点 → 这就是一条 M-可扩路！与"M无可扩路"矛盾。</text>
</svg>

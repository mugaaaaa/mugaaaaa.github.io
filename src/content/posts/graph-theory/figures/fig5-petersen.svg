<svg width="660" height="520" viewBox="0 0 660 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="520" fill="#f8fafc" rx="8"/>
  <text x="330" y="27" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="16" font-weight="bold" fill="#0f172a">彼得森定理：mᵢ 计数不等式</text>
  <text x="330" y="44" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">无割边的 3-正则图 G 有完美匹配 → 验证托特条件 o(G−S) ≤ |S|</text>

  <!-- ── S cluster (center top) ── -->
  <ellipse cx="330" cy="155" rx="78" ry="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="110" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="14" font-weight="bold" fill="#1d4ed8">S  (|S|=3)</text>
  <circle cx="285" cy="160" r="10" fill="#2563eb" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="330" cy="143" r="10" fill="#2563eb" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="375" cy="160" r="10" fill="#2563eb" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="285" y1="160" x2="330" y2="143" stroke="#2563eb" stroke-width="2"/>
  <line x1="330" y1="143" x2="375" y2="160" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="160" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">s₁</text>
  <text x="330" y="143" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">s₂</text>
  <text x="375" y="160" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="11" fill="white">s₃</text>

  <!-- ── G1 (left triangle) ── -->
  <ellipse cx="120" cy="360" rx="58" ry="48" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="120" y="302" text-anchor="middle" font-family="serif" font-size="14" fill="#475569">G₁</text>
  <text x="120" y="318" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#64748b">（奇分支，|V|=3）</text>
  <circle cx="88"  cy="378" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="152" cy="378" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="120" cy="330" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="88"  y1="378" x2="152" y2="378" stroke="#64748b" stroke-width="2"/>
  <line x1="88"  y1="378" x2="120" y2="330" stroke="#64748b" stroke-width="2"/>
  <line x1="152" y1="378" x2="120" y2="330" stroke="#64748b" stroke-width="2"/>
  <text x="88"  y="378" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">a</text>
  <text x="152" y="378" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">b</text>
  <text x="120" y="330" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">c</text>

  <!-- ── G2 (center triangle) ── -->
  <ellipse cx="330" cy="370" rx="58" ry="48" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="330" y="312" text-anchor="middle" font-family="serif" font-size="14" fill="#475569">G₂</text>
  <text x="330" y="328" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#64748b">（奇分支，|V|=3）</text>
  <circle cx="298" cy="390" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="362" cy="390" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="330" cy="342" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="298" y1="390" x2="362" y2="390" stroke="#64748b" stroke-width="2"/>
  <line x1="298" y1="390" x2="330" y2="342" stroke="#64748b" stroke-width="2"/>
  <line x1="362" y1="390" x2="330" y2="342" stroke="#64748b" stroke-width="2"/>
  <text x="298" y="390" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">d</text>
  <text x="362" y="390" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">e</text>
  <text x="330" y="342" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">f</text>

  <!-- ── G3 (right triangle) ── -->
  <ellipse cx="540" cy="360" rx="58" ry="48" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="302" text-anchor="middle" font-family="serif" font-size="14" fill="#475569">G₃</text>
  <text x="540" y="318" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#64748b">（奇分支，|V|=3）</text>
  <circle cx="508" cy="378" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="572" cy="378" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="540" cy="330" r="9" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="508" y1="378" x2="572" y2="378" stroke="#64748b" stroke-width="2"/>
  <line x1="508" y1="378" x2="540" y2="330" stroke="#64748b" stroke-width="2"/>
  <line x1="572" y1="378" x2="540" y2="330" stroke="#64748b" stroke-width="2"/>
  <text x="508" y="378" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">g</text>
  <text x="572" y="378" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">h</text>
  <text x="540" y="330" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="10" fill="white">i</text>

  <!-- ── mᵢ edges: S → Gᵢ (orange) ── -->
  <!-- G1: 3 edges -->
  <line x1="285" y1="160" x2="88"  y2="378" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="330" y1="143" x2="120" y2="330" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="285" y1="160" x2="152" y2="378" stroke="#ea580c" stroke-width="2.5"/>
  <text x="170" y="258" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#ea580c">m₁ = 3</text>

  <!-- G2: 3 edges -->
  <line x1="330" y1="143" x2="298" y2="342" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="330" y1="143" x2="330" y2="342" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="375" y1="160" x2="362" y2="390" stroke="#ea580c" stroke-width="2.5"/>
  <text x="330" y="262" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#ea580c">m₂ = 3</text>

  <!-- G3: 3 edges -->
  <line x1="375" y1="160" x2="508" y2="378" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="375" y1="160" x2="540" y2="330" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="375" y1="160" x2="572" y2="378" stroke="#ea580c" stroke-width="2.5"/>
  <text x="490" y="258" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#ea580c">m₃ = 3</text>

  <!-- ── Counting argument ── -->
  <line x1="28" y1="432" x2="632" y2="432" stroke="#e2e8f0" stroke-width="1"/>

  <text x="330" y="452" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#0f172a">对每个奇分支 Gᵢ（|V(Gᵢ)| 是奇数，G 是 3-正则）：</text>

  <rect x="50" y="462" width="560" height="50" fill="#fff7ed" stroke="#fed7aa" rx="5"/>
  <text x="330" y="479" text-anchor="middle" font-family="serif" font-size="13" fill="#92400e">mᵢ = 3|V(Gᵢ)| − 2|E(Gᵢ)|  →  奇 − 偶 = 奇</text>
  <text x="330" y="498" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#b45309">无割边 ⟹ mᵢ ≥ 2，但 mᵢ 为奇数，∴ mᵢ ≥ 3  →  o(G−S) = k ≤ ⅓·Σmᵢ ≤ ⅓·3|S| = |S|  ✓</text>
</svg>

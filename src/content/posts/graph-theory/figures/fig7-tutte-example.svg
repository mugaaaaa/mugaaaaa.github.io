<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="430" fill="#f8fafc" rx="8"/>
  <text x="360" y="27" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="16" font-weight="bold" fill="#0f172a">托特定理：完美匹配存在条件 o(G−S) ≤ |S|</text>
  <text x="360" y="44" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">图 G 有完美匹配  ⟺  对 V 的每个非空真子集 S，奇分支数 o(G−S) ≤ |S|</text>

  <!-- Vertical divider -->
  <line x1="360" y1="54" x2="360" y2="425" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ══ LEFT: Graph WITHOUT perfect matching ══ -->
  <text x="180" y="70" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="14" font-weight="bold" fill="#dc2626">× 无完美匹配</text>
  <text x="180" y="86" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">图 K₁,₃（一个中心 v 连 3 个叶）</text>

  <!-- K_{1,3}: center v at (180,185), leaves at (90,280), (180,280), (270,280) -->
  <line x1="180" y1="198" x2="90"  y2="268" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="198" x2="180" y2="268" stroke="#334155" stroke-width="2"/>
  <line x1="180" y1="198" x2="270" y2="268" stroke="#334155" stroke-width="2"/>

  <!-- Center v -->
  <circle cx="180" cy="185" r="14" fill="#dc2626"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="180" y="185" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">v</text>

  <!-- Leaves -->
  <circle cx="90"  cy="282" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="90"  y="282" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">a</text>

  <circle cx="180" cy="282" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="180" y="282" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">b</text>

  <circle cx="270" cy="282" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="270" y="282" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">c</text>

  <!-- Take S = {v} -->
  <ellipse cx="180" cy="185" rx="28" ry="28" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="218" y="178" font-family="STSong,SimSun,serif" font-size="12" fill="#dc2626">S = {v}</text>

  <!-- G-S: three isolated vertices (3 odd components) -->
  <text x="180" y="316" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#dc2626">G − S = {a, b, c}（3 个孤立点）</text>
  <text x="180" y="335" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#0f172a">o(G−S) = 3 ＞ 1 = |S|</text>

  <rect x="30" y="352" width="300" height="50" fill="#fee2e2" stroke="#fca5a5" rx="5"/>
  <text x="180" y="368" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#dc2626">托特条件不满足！</text>
  <text x="180" y="386" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#b91c1c">K₁,₃ 有 4 个顶点（奇数×2=4，偶数），</text>
  <text x="180" y="402" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#b91c1c">本身就不可能有完美匹配。</text>

  <!-- ══ RIGHT: Graph WITH perfect matching ══ -->
  <text x="540" y="70" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="14" font-weight="bold" fill="#16a34a">✓ 有完美匹配</text>
  <text x="540" y="86" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">图 C₄（4-环），对任意 S 均 o(G−S) ≤ |S|</text>

  <!-- C4: square, vertices (450,170),(630,170),(630,300),(450,300) -->
  <!-- Edges: 4-cycle -->
  <line x1="465" y1="170" x2="615" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="615" y1="170" x2="615" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="615" y1="300" x2="465" y2="300" stroke="#334155" stroke-width="2"/>
  <line x1="465" y1="300" x2="465" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- Perfect matching: {v1v2, v3v4} in blue -->
  <line x1="465" y1="170" x2="615" y2="170" stroke="#2563eb" stroke-width="6"/>
  <line x1="615" y1="300" x2="465" y2="300" stroke="#2563eb" stroke-width="6"/>

  <circle cx="465" cy="170" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="465" y="170" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">v₁</text>

  <circle cx="615" cy="170" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="615" y="170" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">v₂</text>

  <circle cx="615" cy="300" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="615" y="300" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">v₃</text>

  <circle cx="465" cy="300" r="14" fill="#1e293b"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="465" y="300" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="13" fill="white">v₄</text>

  <text x="540" y="232" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#2563eb">完美匹配 M = {v₁v₂, v₃v₄}</text>

  <!-- Check Tutte for S = {v1}: G-{v1} = path v2-v3-v4, one component (even? no, 3 vertices = odd) -->
  <!-- Actually v2-v3-v4 is a path of 3 vertices (odd). So o(G-{v1}) = 1 = |S|. OK ✓ -->
  <!-- For S = {v1, v3}: G-S = {v2} and {v4}, two isolated vertices, o = 2 = |S|. OK ✓ -->
  <text x="540" y="332" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#16a34a">验证：对任意 S ⊆ V，o(G−S) ≤ |S|</text>
  <text x="540" y="350" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">例：S={v₁}，G−S = 路 v₂v₃v₄（1 个奇分支）≤ 1 ✓</text>
  <text x="540" y="368" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#64748b">例：S={v₁,v₃}，G−S = {v₂},{v₄}（2 个奇分支）≤ 2 ✓</text>

  <rect x="375" y="385" width="330" height="36" fill="#dcfce7" stroke="#86efac" rx="5"/>
  <text x="540" y="399" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#166534">托特条件全部满足 → 存在完美匹配</text>
  <text x="540" y="415" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#15803d">（蓝色边即为完美匹配的一组见证）</text>
</svg>

<svg width="700" height="490" viewBox="0 0 700 490" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="490" fill="#f8fafc" rx="8"/>
  <text x="350" y="27" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="16" font-weight="bold" fill="#0f172a">Hall 定理充分性：Z 集合的构造</text>
  <text x="350" y="44" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#475569">设 M* 是最大匹配但不饱和 X 中顶点 u，从 u 出发走 M*-交错路，看能到达哪些点</text>

  <!-- ── Region backgrounds ── -->
  <!-- S = {u, x1, x2}: blue pill, X-layer y≈135 -->
  <rect x="48"  y="108" width="310" height="52" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="26"/>
  <!-- X-S = {x3}: gray pill -->
  <rect x="470" y="108" width="100" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="26"/>
  <!-- T = {y1, y2}: orange pill, Y-layer y≈295 -->
  <rect x="88"  y="272" width="230" height="52" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5" rx="26"/>
  <!-- Y-T = {y3}: gray pill -->
  <rect x="430" y="272" width="160" height="52" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="26"/>

  <!-- Region labels -->
  <text x="203" y="97"  text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#1d4ed8">S = X ∩ Z = { u, x₁, x₂ }</text>
  <text x="520" y="97"  text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#64748b">X − S</text>
  <text x="203" y="262" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#c2410c">T = Y ∩ Z = { y₁, y₂ }</text>
  <text x="510" y="262" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#64748b">Y − T</text>

  <!-- ── M* matching edges (blue thick) ── -->
  <!-- x1(195,135) ↔ y1(150,298), x2(310,135) ↔ y2(270,298), x3(520,135) ↔ y3(510,298) -->
  <line x1="195" y1="160" x2="150" y2="272" stroke="#2563eb" stroke-width="6"/>
  <line x1="310" y1="160" x2="270" y2="272" stroke="#2563eb" stroke-width="6"/>
  <line x1="520" y1="160" x2="510" y2="272" stroke="#2563eb" stroke-width="6"/>

  <!-- ── Alternating path edges from u ── -->
  <!-- Step 1: u(80,135) → y1 (non-M*) -->
  <line x1="80"  y1="160" x2="150" y2="272" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- Step 3: x1 → y2 (non-M*) -->
  <line x1="195" y1="160" x2="270" y2="272" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- Also u → y2 edge -->
  <line x1="80"  y1="160" x2="270" y2="272" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- No edge from S to Y-T (blocked) -->
  <line x1="150" y1="160" x2="510" y2="272" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7,4" opacity="0.35"/>
  <line x1="310" y1="160" x2="510" y2="272" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7,4" opacity="0.35"/>

  <!-- Step labels -->
  <text x="96"  y="218" font-family="STSong,SimSun,serif" font-size="10" fill="#f97316">①非M*</text>
  <text x="230" y="232" font-family="STSong,SimSun,serif" font-size="10" fill="#2563eb">②M*</text>
  <text x="278" y="218" font-family="STSong,SimSun,serif" font-size="10" fill="#f97316">③非M*</text>
  <text x="345" y="232" font-family="STSong,SimSun,serif" font-size="10" fill="#2563eb">④M*</text>
  <text x="490" y="213" font-family="STSong,SimSun,serif" font-size="10" fill="#dc2626" opacity="0.7">无此边</text>

  <!-- ── Vertices ── -->
  <!-- u -->
  <circle cx="80"  cy="135" r="14" fill="white"   stroke="#dc2626" stroke-width="3"/>
  <text x="80"  y="135" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="15" fill="#dc2626">u</text>
  <text x="80"  y="176" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="10" fill="#dc2626">非饱和</text>

  <!-- x1, x2 in S: blue -->
  <circle cx="195" cy="135" r="14" fill="#2563eb"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="195" y="135" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">x₁</text>

  <circle cx="310" cy="135" r="14" fill="#2563eb"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="310" y="135" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">x₂</text>

  <!-- x3 in X-S: gray -->
  <circle cx="520" cy="135" r="14" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="520" y="135" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">x₃</text>

  <!-- y1, y2 in T: orange -->
  <circle cx="150" cy="298" r="14" fill="#ea580c"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="150" y="298" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">y₁</text>

  <circle cx="270" cy="298" r="14" fill="#ea580c"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="270" y="298" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">y₂</text>

  <!-- y3 in Y-T: gray -->
  <circle cx="510" cy="298" r="14" fill="#94a3b8"  stroke="#0f172a" stroke-width="1.5"/>
  <text x="510" y="298" text-anchor="middle" dominant-baseline="middle" font-family="serif" font-size="14" fill="white">y₃</text>

  <!-- ── M* pairing arrows ── -->
  <text x="350" y="356" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#1d4ed8">M* 将 S − {u} = {x₁, x₂} 与 T = {y₁, y₂} 一一配对</text>
  <text x="350" y="374" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#0f172a">∴  |T| = |S| − 1 = 2</text>

  <!-- ── Key box ── -->
  <rect x="60" y="390" width="580" height="68" fill="#fef9c3" stroke="#fbbf24" rx="5"/>
  <text x="350" y="408" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#78350f">关键论证：N(S) = T</text>
  <text x="350" y="426" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="11" fill="#92400e">若 S 有邻点 y ∉ T，则存在非M*-边 xy（x∈S），可从 u 沿交错路走到 y，y 应已在 Z 中 → 矛盾</text>
  <text x="350" y="448" text-anchor="middle" font-family="STSong,SimSun,serif" font-size="12" fill="#dc2626">∴  |N(S)| = |T| = |S|−1 ＜ |S|，违反 Hall 条件！矛盾。充分性得证。</text>
</svg>
